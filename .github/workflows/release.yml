name: Release

on:
  push:
    tags:
      - "v**"
      - "!**-**"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
          cache: gradle

      - name: Build with Gradle
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $GITHUB_WORKSPACE/key.jks
          ./gradlew packageReleaseUniversalApk -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/key.jks -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} -Pandroid.injected.signing.key.alias=${{ secrets.KEYSTORE_ALIAS }} -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Prepare assets
        run: |
          mv app/build/outputs/apk_from_bundle/release/app-release-universal.apk lactool.apk
          mv app/build/outputs/mapping/release/mapping.txt mapping.txt

      - name: Generate changelog
        id: changelog
        uses: requarks/changelog-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          writeToFile: false
          excludeTypes: build,chore,ci,docs,other,style
      
      - name: Create Release
        uses: ncipollo/release-action@v1.21.0
        with:
          draft: false
          immutableCreate: true
          makeLatest: true
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changes }}
          token: ${{ github.token }}
          artifacts: |
            lactool.apk
            mapping.txt

      - name: Attest outputs
        uses: actions/attest@v4
        with:
          subject-name: "LAC Tool ${{ github.ref_name }}"
          subject-path: |
            lactool.apk
            mapping.txt
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lactool
          path: |
            lactool.apk
            mapping.txt